version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: autswot-app
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - autswot-network
      - coolify

networks:
  autswot-network:
    driver: bridge
  coolify:
    name: coolify
    external: true
